[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-aggregation"
version = "0.1.0"
description = "Координатор распределённого инференса LLM в локальной сети на базе llama.cpp RPC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scykorr" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "psutil>=5.9",
    "cryptography>=42",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fastagg = "fast_aggregation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fast_aggregation = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
