name: Android APK

on:
  push:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Embed llama.cpp Android binaries
        run: bash android/fetch-runtimes.sh

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Unit tests and debug APK
        working-directory: android
        run: gradle test assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fastagg-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
