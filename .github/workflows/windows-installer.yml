name: Windows installer

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller pystray pillow

      - name: Stamp version from the run number
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "from fast_aggregation.version import file_version, full_version, product_version, windows_quad; import os; path=os.environ['GITHUB_ENV']; open(path,'a',encoding='utf-8').write('FASTAGG_FILE={0}\nFASTAGG_FULL={1}\nFASTAGG_PRODUCT={2}\nFASTAGG_QUAD={3}\n'.format(file_version(), full_version(), product_version(), windows_quad()))"

      - name: Build exe
        run: pyinstaller packaging/fastagg.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Smoke test the exe
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: pwsh -ExecutionPolicy Bypass -File packaging/smoke.ps1 -Exe dist\fastagg.exe

      - name: Download offline llama.cpp CPU, Vulkan and CUDA archives
        run: |
          New-Item -ItemType Directory -Force -Path packaging\runtimes, packaging\cuda | Out-Null
          $base = "https://github.com/ggml-org/llama.cpp/releases/download/b12359"
          curl.exe -fL --retry 3 -o packaging\runtimes\llama-b12359-bin-win-cpu-x64.zip "$base/llama-b12359-bin-win-cpu-x64.zip"
          curl.exe -fL --retry 3 -o packaging\runtimes\llama-b12359-bin-win-vulkan-x64.zip "$base/llama-b12359-bin-win-vulkan-x64.zip"
          curl.exe -fL --retry 3 -o packaging\cuda\llama-b12359-bin-win-cuda-12.4-x64.zip "$base/llama-b12359-bin-win-cuda-12.4-x64.zip"
          curl.exe -fL --retry 3 -o packaging\cuda\llama-b12359-bin-win-cuda-13.5-x64.zip "$base/llama-b12359-bin-win-cuda-13.5-x64.zip"
          curl.exe -fL --retry 3 -o packaging\cuda\cudart-llama-bin-win-cuda-12.4-x64.zip "$base/cudart-llama-bin-win-cuda-12.4-x64.zip"
          curl.exe -fL --retry 3 -o packaging\cuda\cudart-llama-bin-win-cuda-13.5-x64.zip "$base/cudart-llama-bin-win-cuda-13.5-x64.zip"
          Get-ChildItem packaging\cuda\*.zip, packaging\runtimes\*.zip | ForEach-Object {
            Write-Host "$($_.Name) $($_.Length)"
            if ($_.Length -lt 5MB) { throw "archive too small: $($_.Name)" }
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installers
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $common = @(
            "/DMyAppVersion=$env:FASTAGG_PRODUCT",
            "/DMyAppVersionFull=$env:FASTAGG_FULL",
            "/DMyAppVersionQuad=$env:FASTAGG_QUAD"
          )
          & $iscc @common "/DSetupBaseName=fastagg-setup-$env:FASTAGG_FILE" packaging\fastagg.iss
          & $iscc @common "/DSetupBaseName=fastagg-setup-cuda-$env:FASTAGG_FILE" packaging\fastagg-cuda.iss

      - name: Upload exe and installer
        uses: actions/upload-artifact@v4
        with:
          name: fastagg-windows-${{ env.FASTAGG_FILE }}
          path: |
            dist/fastagg.exe
            dist/installer/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fastagg.exe
            dist/installer/*.exe
