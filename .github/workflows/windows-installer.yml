name: Windows installer

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller pystray pillow

      - name: Build exe
        run: pyinstaller packaging/fastagg.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Smoke test the exe
        run: powershell -ExecutionPolicy Bypass -File packaging/smoke.ps1 -Exe dist\fastagg.exe

      - name: Download offline llama.cpp CPU and Vulkan archives
        run: |
          New-Item -ItemType Directory -Force -Path packaging\runtimes | Out-Null
          curl.exe -fL --retry 3 -o packaging\runtimes\llama-b12359-bin-win-cpu-x64.zip https://github.com/ggml-org/llama.cpp/releases/download/b12359/llama-b12359-bin-win-cpu-x64.zip
          curl.exe -fL --retry 3 -o packaging\runtimes\llama-b12359-bin-win-vulkan-x64.zip https://github.com/ggml-org/llama.cpp/releases/download/b12359/llama-b12359-bin-win-vulkan-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\fastagg.iss

      - name: Upload exe and installer
        uses: actions/upload-artifact@v4
        with:
          name: fastagg-windows
          path: |
            dist/fastagg.exe
            dist/installer/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fastagg.exe
            dist/installer/*.exe
