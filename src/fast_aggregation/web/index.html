<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fastagg — кластер LLM</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10140f;
      --panel: #1a2118;
      --line: #2d3a2a;
      --text: #e7f0e2;
      --muted: #9aab96;
      --ok: #8fce6a;
      --warn: #e2c16b;
      --bad: #e07a6a;
      --accent: #c6f27a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header, main { padding: 20px 24px; }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 22px; font-weight: 650; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .muted { color: var(--muted); }
    .phase { font-weight: 650; }
    .phase.running { color: var(--ok); }
    .phase.error { color: var(--bad); }
    .phase.starting, .phase.stopping { color: var(--warn); }
    main { display: grid; gap: 16px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; vertical-align: top; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .03em; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--bad); }
    .dot.on { background: var(--ok); }
    form, .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    input[type="text"], input[type="number"] {
      background: #0e130d;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      min-width: 180px;
    }
    button {
      background: var(--accent);
      color: #17200f;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button:disabled { opacity: .55; cursor: wait; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0e130d;
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0 0;
      max-height: 240px;
      overflow: auto;
    }
    .warn { color: var(--warn); }
    .error { color: var(--bad); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
    .chip.on { border-color: var(--ok); color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>fastagg</h1>
      <div class="muted">Распределённый инференс в локальной сети, движок llama.cpp RPC</div>
    </div>
    <div>Состояние: <span id="phase" class="phase">…</span></div>
  </header>
  <main>
    <section>
      <h2>Узлы</h2>
      <div id="nodes">Загрузка…</div>
      <form id="manual" style="margin-top: 12px">
        <label>Добавить узел вручную
          <input id="address" type="text" placeholder="192.168.1.20:47000" />
        </label>
        <button type="submit">Добавить</button>
      </form>
      <div id="manual-error" class="error"></div>
    </section>
    <section>
      <h2>Запуск модели</h2>
      <p class="muted">Файл GGUF должен лежать на этой машине. Воркеры получают веса по RPC. Укажите путь или репозиторий Hugging Face.</p>
      <form id="launch">
        <label>Путь к GGUF
          <input id="model" type="text" placeholder="D:\models\model.gguf" />
        </label>
        <label>Hugging Face
          <input id="hf" type="text" placeholder="ggml-org/gemma-3-1b-it-GGUF:Q4_K_M" />
        </label>
        <label>Контекст
          <input id="ctx" type="number" min="0" step="256" placeholder="из модели" />
        </label>
        <label>Потоки
          <input id="parallel" type="number" min="1" value="1" />
        </label>
        <label>Запас VRAM, МиБ
          <input id="reserve" type="number" min="0" value="512" />
        </label>
        <label>CPU-узлы
          <input id="allow-cpu" type="checkbox" />
          <span>Нужно, если в плане нет GPU</span>
        </label>
        <button id="preview" class="ghost" type="button">Показать план</button>
        <button id="start" type="submit">Запустить</button>
        <button id="stop" class="ghost" type="button">Остановить</button>
      </form>
      <div id="form-error" class="error"></div>
      <div id="plan"></div>
    </section>
    <section>
      <h2>Журнал llama-server</h2>
      <pre id="log">Процесс ещё не запускался.</pre>
    </section>
  </main>
  <script>
    const phaseEl = document.querySelector("#phase");
    const nodesEl = document.querySelector("#nodes");
    const planEl = document.querySelector("#plan");
    const logEl = document.querySelector("#log");
    const formError = document.querySelector("#form-error");
    let busy = false;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function mb(value) {
      if (value == null) return "н/д";
      if (value >= 1024) return (value / 1024).toFixed(1) + " ГиБ";
      return value + " МиБ";
    }

    function backends(list) {
      if (!list || !list.length) return "—";
      return `<div class="chips">${list.map((item) =>
        `<span class="chip ${item.available ? "on" : ""}">${esc(item.name)}</span>`
      ).join("")}</div>`;
    }

    function gpus(list) {
      if (!list || !list.length) return "нет";
      return list.map((gpu) =>
        `${esc(gpu.name)} (${esc(gpu.vendor)}, ${mb(gpu.vram_free_mb)} своб. / ${mb(gpu.vram_total_mb)})`
      ).join("<br>");
    }

    function renderNodes(nodes) {
      if (!nodes.length) {
        nodesEl.innerHTML = "<p class='muted'>Пока никого. Запустите fastagg node на других компьютерах этой сети или добавьте адрес вручную.</p>";
        return;
      }
      const rows = nodes.map((node) => {
        const res = node.resources || {};
        return `<tr>
          <td><span class="dot ${node.online ? "on" : ""}"></span>${esc(node.name)}<div class="muted">${esc(node.node_id).slice(0, 8)}</div></td>
          <td>${esc(node.host)}:${node.http_port}<div class="muted">RPC ${node.rpc_port} · ${esc(node.source)}</div></td>
          <td>${esc(res.os_name || node.os_name)} ${esc(res.arch || node.arch || "")}<div class="muted">${esc(res.os_version || "")}</div></td>
          <td>${esc(res.cpu_model || "—")}<div class="muted">${res.cpu_logical || "?"} логич. / ${res.cpu_physical ?? "?"} физ.</div></td>
          <td>${mb(res.ram_available_mb)} своб.<div class="muted">из ${mb(res.ram_total_mb)}</div></td>
          <td>${gpus(res.gpus)}</td>
          <td>${backends(res.backends)}<div class="muted">предпочтение: ${esc(node.preferred_backend)}</div></td>
          <td>${node.rpc && node.rpc.running ? "RPC слушает" : "RPC выключен"}${node.rpc && node.rpc.backend ? " · " + esc(node.rpc.backend) : ""}${node.last_error ? `<div class="error">${esc(node.last_error)}</div>` : ""}</td>
          <td>${node.age_sec} с</td>
          <td>${node.source === "manual" ? `<button class="ghost" data-remove="${esc(node.node_id)}">Убрать</button>` : ""}</td>
        </tr>`;
      }).join("");
      nodesEl.innerHTML = `<table><thead><tr>
        <th>Узел</th><th>Адрес</th><th>ОС</th><th>CPU</th><th>ОЗУ</th><th>GPU</th><th>Бэкенды</th><th>RPC</th><th>Давно</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderPlan(plan, command) {
      if (!plan) {
        planEl.innerHTML = "";
        return;
      }
      const devices = (plan.devices || []).map((device) =>
        `<li>${esc(device.node_name)} · ${esc(device.name)} · ${device.memory_mb} МиБ · ${(device.share * 100).toFixed(1)}% · ${esc(device.backend)}</li>`
      ).join("");
      const warnings = (plan.warnings || []).map((item) => `<div class="warn">${esc(item)}</div>`).join("");
      planEl.innerHTML = `<h2>План слоёв</h2><ul>${devices}</ul>${warnings}
        <div class="muted">RPC: ${esc((plan.rpc_endpoints || []).join(", "))}</div>
        <div class="muted">tensor-split: ${esc((plan.tensor_split || []).join(","))}</div>
        ${command ? `<pre>${esc(command)}</pre>` : ""}`;
    }

    function payload() {
      return {
        model_path: document.querySelector("#model").value,
        hf_repo: document.querySelector("#hf").value,
        ctx_size: Number(document.querySelector("#ctx").value) || null,
        parallel: Number(document.querySelector("#parallel").value) || 1,
        reserve_mb: Number(document.querySelector("#reserve").value) || 0,
        allow_cpu: document.querySelector("#allow-cpu").checked,
      };
    }

    async function refresh() {
      if (busy) return;
      const response = await fetch("/api/state");
      const data = await response.json();
      phaseEl.textContent = data.phase + (data.error ? " — " + data.error : "");
      phaseEl.className = "phase " + data.phase;
      renderNodes(data.nodes || []);
      if (data.plan) renderPlan(data.plan, null);
      const lines = data.engine && data.engine.log_tail;
      logEl.textContent = lines && lines.length ? lines.join("\n") : "Процесс ещё не запускался.";
    }

    document.querySelector("#manual").addEventListener("submit", async (event) => {
      event.preventDefault();
      document.querySelector("#manual-error").textContent = "";
      const response = await fetch("/api/nodes", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({address: document.querySelector("#address").value}),
      });
      const data = await response.json();
      if (!response.ok) {
        document.querySelector("#manual-error").textContent = data.detail || "Не удалось добавить узел";
        return;
      }
      document.querySelector("#address").value = "";
      refresh();
    });

    nodesEl.addEventListener("click", async (event) => {
      const id = event.target && event.target.dataset && event.target.dataset.remove;
      if (!id) return;
      await fetch("/api/nodes/" + encodeURIComponent(id), {method: "DELETE"});
      refresh();
    });

    document.querySelector("#preview").addEventListener("click", async () => {
      formError.textContent = "";
      const response = await fetch("/api/plan", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload()),
      });
      const data = await response.json();
      if (!response.ok) {
        formError.textContent = data.detail || "План не построен";
        return;
      }
      renderPlan(data.plan, data.command);
    });

    document.querySelector("#launch").addEventListener("submit", async (event) => {
      event.preventDefault();
      formError.textContent = "";
      busy = true;
      document.querySelector("#start").disabled = true;
      phaseEl.textContent = "starting";
      try {
        const response = await fetch("/api/cluster/start", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload()),
        });
        const data = await response.json();
        if (!response.ok) formError.textContent = data.detail || "Запуск не удался";
        else if (data.plan) renderPlan(data.plan, null);
      } finally {
        busy = false;
        document.querySelector("#start").disabled = false;
        refresh();
      }
    });

    document.querySelector("#stop").addEventListener("click", async () => {
      await fetch("/api/cluster/stop", {method: "POST"});
      refresh();
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
